<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Banana Blast</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #231F20;
      }
      #unity-canvas {
        width: 100% !important;
        height: 100% !important;
        position: absolute;
        left: 0;
        top: 0;
      }
      .privacy-link {
        color: rgba(255,255,255,0.6);
        text-decoration: none;
        background: rgba(0,0,0,0.4);
        padding: 4px 8px;
        border-radius: 4px;
        transition: color 0.2s;
      }
      .privacy-link:hover {
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    
    <div style="position: fixed; bottom: 8px; right: 12px; z-index: 999; font-family: Arial, sans-serif; font-size: 11px;">
        <a href="privacy.html" target="_blank" class="privacy-link">Privacy Policy</a>
    </div>

    <script src="Build/TestSpel.loader.js"></script>
    <script>
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
      }

      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/TestSpel.data",
        frameworkUrl: "Build/TestSpel.framework.js",
        codeUrl: "Build/TestSpel.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "YeyeStudios",
        productName: "BananaBlast",
        productVersion: "0.1.0",
        autoSyncPersistentDataPath: true,
      }).then((unityInstance) => {
      }).catch((message) => {
        alert(message);
      });

      window.addEventListener('click', function enterFullscreen() {
        let elem = document.documentElement;
        if (elem.requestFullscreen) {
          elem.requestFullscreen();
        } else if (elem.webkitRequestFullscreen) {
          elem.webkitRequestFullscreen();
        } else if (elem.msRequestFullscreen) {
          elem.msRequestFullscreen();
        }
        window.removeEventListener('click', enterFullscreen);
      });
    </script>
  </body>
</html>
